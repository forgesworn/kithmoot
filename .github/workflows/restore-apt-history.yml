name: Restore historical KithMoot APT downloads

on:
  push:
    branches: [test/restore-apt-history-0.1.180]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Reattach the original packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/restore-apt-history/restore.py
