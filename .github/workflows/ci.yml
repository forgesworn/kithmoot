name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # npm test builds the library first via pretest - the forwarder and
      # TURN-credential suites import it out of dist/, which is gitignored.
      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

  # The acceptance tests: the built app in a real browser, two or three
  # devices in a room, measured off decoded pixels and audio energy. The
  # unit suite cannot catch a room that negotiates media perfectly and puts
  # none of it on screen - that shipped once - so this runs on every push.
  # Against the local relay in test/ws-relay.mjs rather than public ones:
  # real relays have real weather, and a gate that fails on somebody else's
  # outage is a gate people learn to ignore.
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the app, serves it, and - because
      # E2E_RELAYS=local - starts the test relay beside it.
      - name: Acceptance tests
        run: npx playwright test test/media.spec.ts test/e2e.spec.ts test/effects.spec.ts test/relay-capability.spec.ts test/peer-assist.spec.ts test/rooms.spec.ts
        env:
          E2E_RELAYS: local

      - name: Keep the traces of anything that failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
