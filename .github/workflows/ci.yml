name: Chromium microphone diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  microphone:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repair: [baseline, prior-rollback-fix]
    container:
      image: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --init --ipc=host --user 1001
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - if: matrix.repair == 'prior-rollback-fix'
        run: git cherry-pick --no-commit cbac56382622d2932075956a8436945ac9644578
      - run: npm ci
      - run: npm run test:e2e -- test/audio-activity.spec.ts --project=chromium --project=chromium-desktop --grep 'five callers keep' --repeat-each=2
