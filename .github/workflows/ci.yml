name: Focused gallery qualification
run-name: Focused gallery for ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact clean source commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  gallery:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --init --ipc=host --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: desktop gallery pair, project: chromium-desktop, spec: test/call-surface.spec.ts, grep: 'portrait cameras|the persistent gallery.*\(desktop\)' }
          - { label: touch gallery pair, project: chromium-desktop, spec: test/call-surface.spec.ts, grep: 'portrait cameras|the persistent gallery.*\(touch phone\)' }
    steps:
      - name: Validate source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "${#SOURCE_SHA}" = 40 && test -z "$(printf '%s' "$SOURCE_SHA" | tr -d '0-9a-f')"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Verify exact clean checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'Qualified source SHA: %s\n' "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare external step reporter
        run: |
          cat > "$RUNNER_TEMP/gallery-progress.cjs" <<'REPORTER'
          const fs = require('node:fs')
          const path = require('node:path')
          module.exports = class {
            constructor() { this.steps = new Map(); this.counts = new Map() }
            onBegin() { fs.mkdirSync('test-results', {recursive:true}) }
            onStepBegin(test, result, step) {
              const data = {at:new Date().toISOString(),test:test.title,category:step.category,title:step.title,location:step.location}
              this.steps.set(test.id,data)
              const count = this.counts.get(test.id) || 0
              if(count < 1000) fs.appendFileSync('test-results/gallery-steps.jsonl',JSON.stringify({event:'begin',...data})+'\n')
              this.counts.set(test.id,count+1)
            }
            onStepEnd(test,result,step) {
              if(step.error) fs.appendFileSync('test-results/gallery-steps.jsonl',JSON.stringify({event:'step-error',at:new Date().toISOString(),test:test.title,title:step.title,location:step.location,error:String(step.error.message).slice(0,6000)})+'\n')
            }
            onTestEnd(test,result) {
              const data = {at:new Date().toISOString(),test:test.title,status:result.status,duration:result.duration,lastStep:this.steps.get(test.id),errors:result.errors.map(e=>({message:String(e.message).slice(0,12000),stack:String(e.stack).slice(0,12000)}))}
              fs.appendFileSync('test-results/gallery-results.jsonl',JSON.stringify(data)+'\n')
              console.log('[gallery-result] '+JSON.stringify(data))
            }
          }
          REPORTER
      - name: Focused original tests with artifact headroom
        timeout-minutes: 12
        env:
          E2E_RELAYS: local
          SPEC: ${{ matrix.spec }}
          PROJECT: ${{ matrix.project }}
          CASE_GREP: ${{ matrix.grep }}
        run: timeout --signal=INT --kill-after=30s 660s npx playwright test "$SPEC" --project="$PROJECT" --grep="$CASE_GREP" --workers=1 --max-failures=1 --reporter="list,$RUNNER_TEMP/gallery-progress.cjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: focused-gallery-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3
          if-no-files-found: warn
