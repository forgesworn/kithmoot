name: CI

on:
  workflow_dispatch:
    inputs:
      prior_lease_diagnostic:
        description: Run repeated Firefox timing diagnostics in addition to all acceptance gates
        type: boolean
        default: false
  # Prose-only changes run nothing: no test reads docs/ or a top-level
  # Markdown file (packages/*/THIRD_PARTY_NOTICES.md is read, and is not
  # matched here - `*.md` stops at the first slash).
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']

permissions:
  contents: read

# A newer push to a pull request makes the run for the older commit moot, so
# that one is cancelled. Runs on main are grouped by commit and never cancel
# each other: every commit on main keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The production dependency floor is a gate, not a memory: any new
      # advisory in a shipped dependency fails the run. Dev-only advisories
      # are out of scope for this check.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Type check
        run: npm run typecheck

      # npm test builds the library first via pretest - the forwarder and
      # TURN-credential suites import it out of dist/, which is gitignored.
      - name: Run tests
        run: npm test

      - name: Check desktop notification and security boundaries
        run: node --test desktop/test/*.test.mjs

      - name: Check Android publication metadata and website copy
        run: npm run verify:android-publication

      - name: Build app
        run: npm run build

      # npm run build already runs this as its last step; kept as its own
      # step too so a telemetry regression shows up by name in CI rather
      # than as an opaque build failure.
      - name: Check for third-party telemetry in the built app
        run: node scripts/check-no-telemetry.mjs app/dist

      - name: Check independent context packages
        run: npm run test:context-packages

      - name: Check packaged library entry points
        run: node test/package-smoke.mjs

  # Keep native custody checks independent of the already budgeted app
  # acceptance shards. Each fixed project gets a separate process lifetime;
  # line logs retain test identities if a later timeout interrupts the job.
  ordinary-startup:
    name: protected ordinary startup (${{ matrix.project }}, ${{ matrix.slice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        slice: [prepared-startup, member-startup, prepared-extension, complete-extension, clients, startup-guard, startup-built, private-root]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.project }}

      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Build production app for entry validation
        if: matrix.slice == 'startup-built'
        run: npm run build

      - name: Protected ordinary startup custody
        if: matrix.slice != 'private-root'
        run: >-
          npx playwright test -c playwright.ordinary.config.ts
          --project=${{ matrix.project }}-ordinary-${{ matrix.slice }}
          --reporter=line

      # The fixed existing-state root is unmounted. Exercise its actual native
      # ownership boundaries and retained open tails without weakening the
      # seven established startup slices or promoting capture to restoration.
      - name: Private existing-state root and lifetime regressions
        if: matrix.slice == 'private-root'
        run: >-
          npx playwright test -c playwright.ordinary.config.ts
          --project=${{ matrix.project }}-ordinary-private-existing-root
          --project=${{ matrix.project }}-ordinary-protected-worker
          --project=${{ matrix.project }}-ordinary-startup-lifetime
          --project=${{ matrix.project }}-ordinary-state
          --project=${{ matrix.project }}-ordinary-tab
          --reporter=line

      - name: Keep the traces of anything that failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-traces-ordinary-startup-${{ matrix.project }}-${{ matrix.slice }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Diagnostics add evidence; they never replace or skip normal CI jobs.
  prior-lease-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.prior_lease_diagnostic
    name: diagnostic prior lease (${{ matrix.slice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice: [member-startup, prepared-extension, complete-extension]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build library
        run: npm run build:lib
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Measure repeated prior-lease journeys (diagnostic only)
        env:
          ORDINARY_STARTUP_TIMING: '1'
        run: npx playwright test -c playwright.ordinary-startup-diagnostic.config.ts --project=firefox-${{ matrix.slice }}
      - name: Keep diagnostic failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-prior-lease-firefox-${{ matrix.slice }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Keep the unchanged browser regressions out of the acceptance clock.
  # Chromium completed 210 of 211 acceptance cases at the 30-minute job limit
  # after all 634 regression cases passed. Each browser now retains its own
  # complete regression gate, with unchanged test timeouts and no retries.
  browser-regressions:
    name: browser regressions (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.project }}

      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: MLS vault cross-tab regression tests
        run: npm run test:vault -- --project=${{ matrix.project }}

      - name: Browser Link ownership tests
        run: npx playwright test -c playwright.link.config.ts --project=${{ matrix.project }}

      - name: Browser MLS storage, coordination and recovery controls
        run: npx playwright test -c playwright.mls.config.ts --project=${{ matrix.project }}

      - name: Browser MLS preview account lifecycle and production gate
        if: matrix.project == 'chromium'
        run: npm run build:lib && npx playwright test -c playwright.mls-app.config.ts

      - name: Keep the traces of anything that failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-traces-browser-regressions-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The acceptance tests: the built app in a real browser, two or three
  # devices in a room, measured off decoded pixels and audio energy. The
  # unit suite cannot catch a room that negotiates media perfectly and puts
  # none of it on screen - that shipped once - so this runs on every push.
  # Against the local relay in test/ws-relay.mjs rather than public ones:
  # real relays have real weather, and a gate that fails on somebody else's
  # outage is a gate people learn to ignore.
  #
  # Each spec drives two or three real browsers, so a runner takes one spec
  # at a time (`workers: 1` in playwright.config.ts) and the suite is spread
  # across runners instead. Chromium runs everything and took over half an
  # hour on one runner; it is split five ways by measured time, using the
  # groups in playwright.config.ts (`E2E_GROUP`), whose `rest` group takes
  # whatever the others do not name. Firefox and WebKit run small, even
  # specs, so Playwright's own `--shard` halves them well enough.
  acceptance:
    name: acceptance (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Retain the reviewed acceptance job budgets after moving regressions
    # into their own complete per-browser gate. Every Playwright test keeps
    # its existing timeout, assertions and zero retries.
    timeout-minutes: ${{ (matrix.name == 'chromium rest' || matrix.name == 'chromium desktop' || matrix.name == 'firefox 1 of 2' || matrix.name == 'webkit 1 of 2') && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Chromium groups also install Firefox, for the cross-browser
          # call case in test/call-stability.spec.ts; without it that case
          # skips itself rather than proving anything.
          - { name: chromium call-relays, project: chromium, group: call-relays, browsers: chromium firefox }
          - { name: chromium calls, project: chromium, group: calls, browsers: chromium firefox }
          - { name: chromium media, project: chromium, group: media, browsers: chromium firefox }
          - { name: chromium rooms, project: chromium, group: rooms, browsers: chromium firefox }
          - { name: chromium rest, project: chromium, group: rest, browsers: chromium firefox }
          - { name: firefox 1 of 2, project: firefox, shard: 1/2, browsers: firefox }
          - { name: firefox 2 of 2, project: firefox, shard: 2/2, browsers: firefox }
          - { name: webkit 1 of 2, project: webkit, shard: 1/2, browsers: webkit }
          - { name: webkit 2 of 2, project: webkit, shard: 2/2, browsers: webkit }
          # The installed desktop window's layout and call specs, against the
          # VITE_DESKTOP build the config already serves on the next port. Not
          # run here before October 2026, and two of them sat red for a week.
          - { name: chromium desktop, project: chromium-desktop, browsers: chromium }

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The browser downloads only; the system libraries still come from apt
      # in the next step. Mostly insurance against a slow CDN day - one run
      # spent eight minutes fetching Firefox.
      - name: Cache browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browsers }}

      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      # playwright.config.ts builds the app, serves it, and - because
      # E2E_RELAYS=local - starts the test relay beside it.
      - name: Acceptance tests
        run: npx playwright test --project=${{ matrix.project }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
        env:
          E2E_RELAYS: local
          E2E_GROUP: ${{ matrix.group }}

      - name: Keep the traces of anything that failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.group || strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
