name: Audio sink diagnostic only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --init --ipc=host --user 1001
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exact call regression, unchanged assertions
        run: npx playwright test test/calm-shell.spec.ts --project=chromium --project=chromium-desktop --grep 'three account devices and another participant' --workers=1 --trace=on
        env:
          E2E_RELAYS: local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: focused-audio-sink-diagnostics
          path: test-results/
          retention-days: 3
