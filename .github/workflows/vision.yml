name: Vision learning checks

on:
  pull_request:
    paths: ['vision/**', '.github/workflows/vision.yml']
  push:
    branches: [main]
    paths: ['vision/**', '.github/workflows/vision.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install CPU training dependencies
        run: |
          python3 -m venv .vision-venv
          .vision-venv/bin/python -m pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          .vision-venv/bin/python -m pip install --no-cache-dir -e vision
      - name: Check learning, adaptation isolation and data restrictions
        working-directory: vision
        run: ../.vision-venv/bin/python -m unittest discover -s tests -v
      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Prepare Rust native and WASM targets
        run: rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
      - name: Check and build portable inference
        working-directory: vision/runtime
        run: |
          cargo +1.94.1 test --locked
          cargo +1.94.1 build --locked --release --lib
          cargo +1.94.1 build --locked --release --lib --target wasm32-unknown-unknown
      - name: Compare native and WASM to the training graph
        working-directory: vision
        run: |
          ../.vision-venv/bin/python -m kithmoot_vision.synthetic "$RUNNER_TEMP/kithmoot-vision/data" --count 4
          for architecture in v1 mobile-v2; do
            ../.vision-venv/bin/python -m kithmoot_vision.train "$RUNNER_TEMP/kithmoot-vision/data/manifest.jsonl" "$RUNNER_TEMP/kithmoot-vision/$architecture" --architecture "$architecture" --steps 2
            ../.vision-venv/bin/python scripts/check-portability.py runtime/target/release/libkithmoot_vision.so "$RUNNER_TEMP/kithmoot-vision/$architecture/experimental.pt" "$RUNNER_TEMP/kithmoot-vision/parity-$architecture.json"
            node scripts/check-wasm.mjs runtime/target/wasm32-unknown-unknown/release/kithmoot_vision.wasm "$RUNNER_TEMP/kithmoot-vision/parity-$architecture.json"
          done
      - name: Check local lab frame ownership and model provenance
        run: node --test vision/lab/core.test.mjs
      - name: Install browser lab test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Exercise the real WASM camera lab and private training round-trip
        working-directory: vision
        env:
          VISION_PYTHON: ${{ github.workspace }}/.vision-venv/bin/python
          VISION_LAB_MODEL: ${{ runner.temp }}/kithmoot-vision/mobile-v2
          VISION_LAB_DATA: ${{ runner.temp }}/kithmoot-vision/data
        run: |
          ../.vision-venv/bin/python -m kithmoot_vision.export "$RUNNER_TEMP/kithmoot-vision/mobile-v2/experimental.pt" "$RUNNER_TEMP/kithmoot-vision/mobile-v2/experimental.kvm"
          node --test lab/browser.test.mjs
