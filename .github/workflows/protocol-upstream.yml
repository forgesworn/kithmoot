name: Protocol upstream drift
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      private_renewal_prepare_read:
        description: Run bounded native Prepare-read development checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: node scripts/check-protocol-upstream.mjs

  # Isolated development branch only. Original normal CI and product gates stay unchanged.
  private-renewal-prepare-read-native:
    if: github.event_name == 'workflow_dispatch' && inputs.private_renewal_prepare_read
    name: private renewal Prepare-read (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify exact installed validation dependencies
        run: node scripts/verify-private-renewal-locked-dependencies.mjs > locked-dependencies.json
      - name: Build library
        run: npm run build:lib
      - name: Install selected browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify the exact seventeen-case development selection
        run: |
          npx playwright test -c playwright.private-renewal-prepare-read.config.ts --project=${{ matrix.engine }}-sdk020 --list --reporter=json > private-renewal-prepare-read-inventory.json
          node scripts/verify-private-renewal-prepare-read-inventory.mjs private-renewal-prepare-read-inventory.json ${{ matrix.engine }}
      - name: Run the native development selection once
        run: npx playwright test -c playwright.private-renewal-prepare-read.config.ts --project=${{ matrix.engine }}-sdk020 --max-failures=1 --trace=retain-on-failure
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-renewal-prepare-read-native-${{ matrix.engine }}
          path: |
            locked-dependencies.json
            private-renewal-prepare-read-inventory.json
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  private-renewal-prepare-read-support:
    if: github.event_name == 'workflow_dispatch' && inputs.private_renewal_prepare_read
    name: private renewal Prepare-read units and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify exact installed validation dependencies
        run: node scripts/verify-private-renewal-locked-dependencies.mjs > locked-dependencies.json
      - name: Build library
        run: npm run build:lib
      - name: Run the focused units
        run: |
          node node_modules/vitest/vitest.mjs run src/session-retained-native.test.ts src/session-native-binding.test.ts src/session-retention.test.ts src/session-fresh-epoch.test.ts src/session.test.ts src/session-seal.test.ts src/session-member-epoch.test.ts app/src/ordinary-operation-codec.test.ts app/src/ordinary-prepared-renewal-capacity.test.ts app/src/ordinary-renewal-request.test.ts app/src/ordinary-renewal-credential.test.ts app/src/ordinary-member-startup.test.ts app/src/ordinary-protocol-work.test.ts app/src/ordinary-lifecycle-root.test.ts app/src/ordinary-owned-json.test.ts > private-renewal-unit-results.log 2>&1
          cat private-renewal-unit-results.log
      - name: App noEmit
        run: node node_modules/typescript/bin/tsc --noEmit -p app/tsconfig.json > private-renewal-app-noemit.log 2>&1
      - name: Library noEmit
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json > private-renewal-library-noemit.log 2>&1
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-renewal-prepare-read-support
          path: |
            locked-dependencies.json
            private-renewal-unit-results.log
            private-renewal-app-noemit.log
            private-renewal-library-noemit.log
          if-no-files-found: ignore
          retention-days: 7
