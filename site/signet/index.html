<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back to KithMoot</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #121212; color: #EAE6DC; font: 1.05rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 3rem 1.5rem; }
  h1 { font-size: 1.6rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 1rem; }
  a.button { display: inline-block; padding: 0.8rem 1.4rem; border-radius: 0.6rem; background: #5AC8FA; color: #101418; font-weight: 600; text-decoration: none; }
  a.button:focus-visible { outline: 3px solid #EAE6DC; outline-offset: 2px; }
  .quiet { color: #A9A49A; font-size: 0.95rem; }
</style>
</head>
<body>
<main>
  <h1 id="title">Back to KithMoot</h1>
  <p id="lead">Signet has answered. Opening the app…</p>
  <p><a class="button" id="open" href="kithmoot://signet?status=approved">Open KithMoot</a></p>
  <p class="quiet">If nothing happens, the KithMoot app is not installed on this device. This page only sends you back to it; it holds nothing.</p>
</main>
<script>
  // Signet sends the browser here after a nostrconnect pairing, with
  // ?status=approved or ?status=denied. Everything that matters already
  // happened over the relay; this page exists because Signet will only
  // send a browser to an https address, and the app answers a kithmoot://
  // one. On Android the intent: form lets Chrome hand over to the app
  // without a "leave the page?" prompt; the button is the same trip by hand.
  var status = new URLSearchParams(location.search).get('status') === 'denied' ? 'denied' : 'approved';
  var target = 'kithmoot://signet?status=' + status;
  var intent = 'intent://signet?status=' + status + '#Intent;scheme=kithmoot;package=dev.forgesworn.kithmoot;end';
  document.getElementById('open').href = target;
  if (status === 'denied') {
    document.getElementById('title').textContent = 'Signet declined';
    document.getElementById('lead').textContent = 'No sign-in was made. Open KithMoot to try another way in.';
  }
  var android = /Android/i.test(navigator.userAgent);
  setTimeout(function () { location.replace(android ? intent : target); }, 150);
</script>
</body>
</html>
