<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KithMoot — stage 1</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        background: #111;
        color: #eee;
        max-width: 720px;
        margin-inline: auto;
      }
      h1 {
        margin-bottom: 0;
      }
      .tagline {
        margin-top: 0.25rem;
        color: #999;
      }
      button {
        font-size: 1rem;
        padding: 0.6rem 1rem;
        margin: 0.25rem 0.5rem 0.25rem 0;
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #333;
      }
      input[type='text'],
      input:not([type]) {
        font-family: monospace;
        padding: 0.5rem;
        width: 100%;
        background: #1a1a1a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
      }
      section {
        margin: 1rem 0;
      }
      .linkBox {
        border: 1px solid #333;
        border-radius: 8px;
        padding: 0.75rem;
        margin: 0.75rem 0;
      }
      .linkBox p {
        margin: 0 0 0.5rem;
      }
      .linkBox.pairing {
        border-color: #a44;
        background: #1c1010;
      }
      .linkBox.pairing strong {
        color: #f88;
      }
      #status {
        min-height: 1.25rem;
        color: #f88;
        font-size: 0.9rem;
      }
      .participant {
        border: 2px solid #4a4;
        border-radius: 8px;
        padding: 0.75rem;
        margin: 0.75rem 0;
      }
      .participant.linked {
        border-color: #4af;
        box-shadow: 0 0 0 1px #4af inset;
      }
      .participant h3 {
        margin: 0 0 0.5rem;
        font-size: 0.9rem;
        font-family: monospace;
      }
      .participant .badge {
        display: inline-block;
        margin-left: 0.5rem;
        padding: 0.1rem 0.4rem;
        font-size: 0.7rem;
        font-family: system-ui, sans-serif;
        border-radius: 4px;
        background: #4af;
        color: #002;
        vertical-align: middle;
      }
      .tracks {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .track {
        background: #222;
        border-radius: 4px;
        padding: 0.4rem 0.6rem;
        font-size: 0.85rem;
      }
      .track.mine {
        outline: 2px solid #4af;
      }
      video {
        max-width: 320px;
        border-radius: 4px;
        background: #000;
      }
      #local {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <h1>KithMoot</h1>
    <p class="tagline">A town hall nobody owns.</p>

    <section id="setup">
      <button id="create">Start a room</button>
      <p>or paste a join link:</p>
      <input id="url" placeholder="https://…#…" />
      <button id="openUrl">Open</button>
    </section>

    <section id="joinRoles" hidden>
      <p>Join this room as:</p>
      <button data-role="camera">Camera + mic</button>
      <button data-role="screen">Screen share</button>
      <button data-role="observer">Observer</button>
    </section>

    <section id="links" hidden>
      <div class="linkBox">
        <p>Room's open. Send the link.</p>
        <input id="shareUrl" readonly />
      </div>
      <div class="linkBox pairing">
        <p><strong>This link is you. Only ever send it to your own device.</strong></p>
        <button id="addDevice">Add a device</button>
        <input id="pairUrl" readonly hidden />
      </div>
    </section>

    <p id="status" role="status"></p>

    <div id="local"></div>

    <h2>In the room</h2>
    <div id="room"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
