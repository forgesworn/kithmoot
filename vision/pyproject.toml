[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kithmoot-vision"
version = "0.1.0"
description = "First-party face detection and foreground matting research for KithMoot"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch==2.10.0", "numpy>=2,<3", "Pillow>=11,<13"]

[tool.setuptools.packages.find]
include = ["kithmoot_vision*"]
