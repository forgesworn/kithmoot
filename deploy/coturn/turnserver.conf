# coturn config for the KithMoot default TURN server.
#
# This is a CONVENIENCE, not a requirement. KithMoot rooms carry their own
# ICE server list in the join URL (field `i` - see app/src/main.ts and
# src/room.ts) and that field is editable in the room-creation UI. Anyone
# can self-host coturn from this same config and point their own room at
# it, or point at somebody else's, or run STUN-only and accept that ~20% of
# real-world connections (symmetric NAT, CGNAT, corporate firewalls, some
# same-Wi-Fi cases where the router won't hairpin) will fail. Nothing here
# is protocol-mandated - it's one operator's server, named like any other.
#
# Replace every CHANGE_ME below before use. This file is read-only inside
# the container (see docker-compose.yml) - edit it here, not in place.

# --- listening ---------------------------------------------------------

listening-port=3478
tls-listening-port=5349

# Bound to the box's real public address, not 0.0.0.0, and relay-ip pinned to
# the same. This box carries a dozen docker bridge interfaces (172.17.0.1,
# 172.18.0.1, ...) alongside its public /32 on eth0. With 0.0.0.0 coturn
# enumerates every one of them and can hand a client a relay candidate on a
# bridge address, which is unroutable from the internet and simply never
# connects - a failure that looks exactly like "TURN is broken" and has
# nothing to do with TURN. deploy/coturn/install.sh substitutes the address
# it detects on the default route, so this value is generated, not typed.
listening-ip=CHANGE_ME_PUBLIC_IP
relay-ip=CHANGE_ME_PUBLIC_IP

# No external-ip line on purpose: the public address sits directly on eth0
# as a /32, so coturn is not behind NAT and has nothing to translate. Adding
# external-ip on a non-NATed host makes coturn rewrite addresses that were
# already correct.

# TLS cert/key. This deployment does not run certbot: Caddy already holds a
# live Let's Encrypt certificate for kithmoot.forgesworn.dev (it serves the
# site on 443) and renews it on its own. deploy/coturn/sync-certs.sh copies
# that pair out of Caddy's store into the directory mounted here, and the
# kithmoot-turn-certs.timer runs it daily, restarting coturn only when the
# bytes actually changed. coturn does not watch these files, so without that
# restart TURN over TLS would quietly start serving an expired certificate
# about 60 days after the last deploy.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Disable protocol versions with known weaknesses. TLS 1.2+ only.
no-tlsv1
no-tlsv1_1

# --- identity -----------------------------------------------------------

# The site's own hostname, reused rather than a new turn.* record: it
# already resolves to this box and Caddy already holds a certificate for it,
# so TURN over TLS works with no new DNS and no second certificate to renew.
# A dedicated turn.* name would be tidier and buys nothing.
realm=kithmoot.forgesworn.dev
server-name=kithmoot.forgesworn.dev

# STUN/TURN message fingerprints - lets a client detect a corrupted or
# tampered response. Cheap, no reason to leave it off.
fingerprint

# --- authentication: time-limited credentials, not a static password ---
#
# lt-cred-mech + use-auth-secret is coturn's REST API credential scheme:
# a client is handed a {username, credential} pair that expires on its own
# (see src/turn.ts / mintTurnCredential), computed as
#   username  = "<expiry-unix>:<name>"
#   credential = base64(HMAC-SHA1(static-auth-secret, username))
# coturn re-runs the same HMAC against its own copy of the secret to check
# an incoming connection - no username/password database, no revocation
# list, and nothing that still works a year after a client build leaked it.
# A static username/password pair here would be exactly that kind of
# forever-credential: once it's in a browser bundle, it's public, and
# public TURN credentials get scraped and used to relay someone else's
# traffic on your bandwidth bill.
# use-auth-secret on its own, without an accompanying lt-cred-mech line.
# use-auth-secret already implies the long-term credential mechanism, and
# setting both makes coturn log a CONFIG warning at every start saying the
# two cannot be mixed and that the shared secret wins. The shared secret
# winning is what is wanted here, so the warning is harmless - but a warning
# that is always there is a warning nobody reads, and the line it complains
# about was doing nothing.
use-auth-secret
static-auth-secret=CHANGE_ME_GENERATE_WITH_openssl_rand_-hex_32

# --- relay port range -----------------------------------------------------
#
# Each active TURN allocation (one participant's one media stream, roughly)
# holds one UDP port from this range for its lifetime. 300 ports is enough
# for a very large number of concurrent relayed streams for a project this
# size - KithMoot's own mesh design tops out around 8 participants per
# room, so realistic concurrent relay usage per room is in the tens of
# ports, not hundreds. Widen this only if you have evidence you need to;
# every port in the range must also be open on the firewall (see README).
min-port=49152
max-port=49452

# --- abuse containment ----------------------------------------------------
#
# no-multicast-peers: never relay to a multicast address - there is no
# legitimate WebRTC use for this server to do that.
no-multicast-peers

# no-loopback-peers: never relay to the box's own loopback interface.
no-loopback-peers

# denied-peer-ip: block RFC1918 private ranges, link-local, and loopback as
# TURN *relay targets* (not as clients connecting in - a client on a LAN is
# fine; what's blocked is the relay being told to forward traffic INTO a
# private network). Without this, anyone who can mint a credential (which,
# with the REST scheme above, is "anyone who can load the KithMoot page")
# could ask this public TURN server to open a UDP/TCP relay pointed at
# 10.x/172.16.x/192.168.x addresses - i.e. use this box as a network probe
# into whatever private network it happens to sit on. This is the same
# shape of bug as server-side request forgery (SSRF): a public service
# relaying requests on the caller's behalf into an address space the
# caller couldn't otherwise reach. Blocking the relay target, not just
# trusting the auth layer, is the actual fix.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- quotas ---------------------------------------------------------------
#
# Two different units, and confusing them is the easy mistake here.
# user-quota and total-quota count ALLOCATIONS, not bytes; max-bps and
# bps-capacity are the bytes-per-second controls. Setting user-quota to a
# byte figure does not cap bandwidth, it just sets a ceiling of two million
# concurrent allocations, which is no ceiling at all.
#
# user-quota is per credential username. The minting endpoint gives every
# request its own random name (see server/turn-credentials.mjs), so one
# username is one browser session.
#
# 32, not a tighter number, because a browser does not make one allocation.
# It makes one per local network interface per TURN URL, all at once, during
# candidate gathering - and then throws away all but the one it uses. Three
# URLs (udp, tcp, tls) on a laptop with Wi-Fi, Ethernet and a VPN is already
# nine, and a machine with more interfaces goes higher. Measured on the
# deployment box, which carries nine interfaces because of its docker
# bridges, a single page wanted 27. A quota that a normal client trips
# during gathering does not look like a quota; it looks like TURN being
# broken, because the browser reports nothing but a failure to gather.
user-quota=32

# total-quota is the whole server, and it is deliberately set just under the
# size of the relay port range above (301 ports), which is the real hard
# ceiling: one allocation holds one port. Hitting this returns a clean
# error rather than letting coturn run the range dry.
total-quota=250

# max-bps is per allocation, in bytes per second. A single 1080p video
# stream needs on the rough order of 250-500 KB/s each way, so 1 MB/s covers
# a busy relayed session with headroom. Traffic above the limit is sliced,
# not dropped outright.
max-bps=1000000

# NO bps-capacity LINE, and this is the important one.
#
# It reads like a server-wide bandwidth ceiling. It is not. It is a
# RESERVATION budget: every new allocation reserves max-bps from it up
# front, whether or not it ever sends a byte, and an allocation that cannot
# reserve is refused with 486. That makes the effective limit
# bps-capacity / max-bps CONCURRENT ALLOCATIONS - nothing to do with actual
# traffic.
#
# Set to 25 MB/s against a 2 MB/s max-bps, as this file had it, that is
# twelve allocations for the entire server. One browser gathering candidates
# takes all of them. Observed exactly that way: the first participant
# gathered 13 relay candidates and connected, the second was refused every
# allocation with "486: Allocation Bandwidth Quota Reached" and gathered
# none, so the call silently carried no media - the same symptom as having
# no TURN server at all, which is the bug this deployment exists to fix.
#
# There is no value that makes it behave like a traffic cap. Allowing 250
# concurrent allocations at 1 MB/s would mean setting it to 250 MB/s, which
# is not a limit on anything. Concurrency is bounded by total-quota and the
# port range above; per-session throughput is bounded by max-bps; and the
# actual monthly egress bill is bounded by the hosting account's traffic
# allowance, which is the only place a real spend ceiling exists.

# --- footprint / attack surface -------------------------------------------

# No telnet CLI (default port 5766) - nothing on this box needs it, and it
# is one more thing to keep patched and firewalled.
no-cli

# Log to stdout so `docker compose logs` captures it - no log file to
# rotate or that can quietly fill the disk.
log-file=stdout
simple-log

# Reject a client's very first request if it's already carrying a
# suspiciously old nonce, rather than the more permissive default -
# tightens the replay window without breaking normal use, where a full
# TURN allocation negotiation is well under this.
stale-nonce=600
