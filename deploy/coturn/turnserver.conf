# coturn config for the KithMoot default TURN server.
#
# This is a CONVENIENCE, not a requirement. KithMoot rooms carry their own
# ICE server list in the join URL (field `i` - see app/src/main.ts and
# src/room.ts) and that field is editable in the room-creation UI. Anyone
# can self-host coturn from this same config and point their own room at
# it, or point at somebody else's, or run STUN-only and accept that ~20% of
# real-world connections (symmetric NAT, CGNAT, corporate firewalls, some
# same-Wi-Fi cases where the router won't hairpin) will fail. Nothing here
# is protocol-mandated - it's one operator's server, named like any other.
#
# Replace every CHANGE_ME below before use. This file is read-only inside
# the container (see docker-compose.yml) - edit it here, not in place.

# --- listening ---------------------------------------------------------

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# TLS cert/key - see deploy/README.md for how to get these (certbot,
# same as every other domain on this box). Renewal must restart or
# SIGHUP the container, since coturn does not watch these files.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Disable protocol versions with known weaknesses. TLS 1.2+ only.
no-tlsv1
no-tlsv1_1

# --- identity -----------------------------------------------------------

realm=turn.CHANGE_ME.example
server-name=turn.CHANGE_ME.example

# STUN/TURN message fingerprints - lets a client detect a corrupted or
# tampered response. Cheap, no reason to leave it off.
fingerprint

# --- authentication: time-limited credentials, not a static password ---
#
# lt-cred-mech + use-auth-secret is coturn's REST API credential scheme:
# a client is handed a {username, credential} pair that expires on its own
# (see src/turn.ts / mintTurnCredential), computed as
#   username  = "<expiry-unix>:<name>"
#   credential = base64(HMAC-SHA1(static-auth-secret, username))
# coturn re-runs the same HMAC against its own copy of the secret to check
# an incoming connection - no username/password database, no revocation
# list, and nothing that still works a year after a client build leaked it.
# A static username/password pair here would be exactly that kind of
# forever-credential: once it's in a browser bundle, it's public, and
# public TURN credentials get scraped and used to relay someone else's
# traffic on your bandwidth bill.
lt-cred-mech
use-auth-secret
static-auth-secret=CHANGE_ME_GENERATE_WITH_openssl_rand_-hex_32

# --- relay port range -----------------------------------------------------
#
# Each active TURN allocation (one participant's one media stream, roughly)
# holds one UDP port from this range for its lifetime. 300 ports is enough
# for a very large number of concurrent relayed streams for a project this
# size - KithMoot's own mesh design tops out around 8 participants per
# room, so realistic concurrent relay usage per room is in the tens of
# ports, not hundreds. Widen this only if you have evidence you need to;
# every port in the range must also be open on the firewall (see README).
min-port=49152
max-port=49452

# --- abuse containment ----------------------------------------------------
#
# no-multicast-peers: never relay to a multicast address - there is no
# legitimate WebRTC use for this server to do that.
no-multicast-peers

# no-loopback-peers: never relay to the box's own loopback interface.
no-loopback-peers

# denied-peer-ip: block RFC1918 private ranges, link-local, and loopback as
# TURN *relay targets* (not as clients connecting in - a client on a LAN is
# fine; what's blocked is the relay being told to forward traffic INTO a
# private network). Without this, anyone who can mint a credential (which,
# with the REST scheme above, is "anyone who can load the KithMoot page")
# could ask this public TURN server to open a UDP/TCP relay pointed at
# 10.x/172.16.x/192.168.x addresses - i.e. use this box as a network probe
# into whatever private network it happens to sit on. This is the same
# shape of bug as server-side request forgery (SSRF): a public service
# relaying requests on the caller's behalf into an address space the
# caller couldn't otherwise reach. Blocking the relay target, not just
# trusting the auth layer, is the actual fix.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- quotas ---------------------------------------------------------------
#
# Both in bytes-per-second. These are deliberately modest: a single 1080p
# video stream needs on the rough order of 250-500 KB/s each way, so
# 2 MB/s per user covers a genuinely busy multi-track relay session
# (camera + mic + screen share) with headroom, without letting one abusive
# or misconfigured client saturate the box's own uplink.
user-quota=2000000
total-quota=40000000

# --- footprint / attack surface -------------------------------------------

# No telnet CLI (default port 5766) - nothing on this box needs it, and it
# is one more thing to keep patched and firewalled.
no-cli

# Log to stdout so `docker compose logs` captures it - no log file to
# rotate or that can quietly fill the disk.
log-file=stdout
simple-log

# Reject a client's very first request if it's already carrying a
# suspiciously old nonce, rather than the more permissive default -
# tightens the replay window without breaking normal use, where a full
# TURN allocation negotiation is well under this.
stale-nonce=600
