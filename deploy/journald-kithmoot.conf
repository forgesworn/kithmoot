# Example journald retention drop-in for a box running KithMoot services
# (forwarder, keeper, blossom, turn-credentials). See deploy/README.md's
# "Logs" section for what each service writes and why this exists.
#
# Not installed by any script here - copy it into place by hand:
#
#   install -D -m 0644 deploy/journald-kithmoot.conf \
#     /etc/systemd/journald.conf.d/kithmoot.conf
#   systemctl restart systemd-journald
#
# Restarting journald rotates the journal; it does not retroactively delete
# anything already kept longer than the limits below, only apply them to
# what happens from then on.
#
# This is a SYSTEM-WIDE journald setting, not scoped to KithMoot's own
# units - the right scope for a box that runs only these services. A shared
# box that wants retention scoped to just these units instead needs a
# journal namespace (LogNamespace= in each unit, plus a matching
# journald@<namespace>.conf), which is more to operate than this kit sets
# up by default.

[Journal]
# Nothing here needs keeping for months. Two weeks is enough to debug a
# forwarder or keeper that has been misbehaving without becoming its own
# long-term record of who ran what, when.
MaxRetentionSec=2week

# Belt and braces beside the time bound: caps total on-disk size regardless
# of how much a busy box logs in that fortnight. Adjust to what the box's
# disk can spare; this is deliberately conservative for a small VPS.
SystemMaxUse=500M
